 markerHeight="6.5" orient="auto-start-reverse">

<rect x="281.0" y="30" width="230" height="52" rx="26.0" fill="#16130F"/><rect x="277.0" y="26" width="230" height="52" rx="26.0" fill="#2F9E44" stroke="#16130F" stroke-width="2.5"/><text x="392" y="57.0" class="ct" text-anchor="middle" fill="#FFFFFF">Start</text><polyline points="392,78 392,108" fill="none" stroke="#16130F" stroke-width="2.4" marker-end="url(#ah)"/><rect x="251.0" y="116" width="290" height="62" rx="10" fill="#16130F"/><rect x="247.0" y="112" width="290" height="62" rx="10" fill="#E9E1D6" stroke="#16130F" stroke-width="2.5"/><rect x="247.0" y="112" width="6" height="62" rx="3" fill="#5E6B73"/><text x="395" y="137.0" class="ct" text-anchor="middle">Initialise camera and model</text><text x="395" y="154.0" class="cs" text-anchor="middle">Load YOLO26n (NCNN), read the area and threshold</text><polyline points="392,174 392,204" fill="none" stroke="#16130F" stroke-width="2.4" marker-end="url(#ah)"/><polygon points="283.0,212 527.0,212 509.0,274 265.0,274" fill="#16130F"/><polygon points="279.0,208 523.0,208 505.0,270 261.0,270" fill="#E9E1D6" stroke="#16130F" stroke-width="2.5" stroke-linejoin="round"/><rect x="279.0" y="208" width="244" height="5" fill="#128C84"/><text x="392" y="244.0" class="ct" text-anchor="middle">Capture live video frame</text><polyline points="392,270 392,300" fill="none" stroke="#16130F" stroke-width="2.4" marker-end="url(#ah)"/><rect x="251.0" y="308" width="290" height="62" rx="10" fill="#16130F"/><rect x="247.0" y="304" width="290" height="62" rx="10" fill="#E9E1D6" stroke="#16130F" stroke-width="2.5"/><rect x="247.0" y="304" width="6" height="62" rx="3" fill="#E8590C"/><text x="395" y="329.0" class="ct" text-anchor="middle">Detect and track</text><text x="395" y="346.0" class="cs" text-anchor="middle">YOLO26n finds items; ByteTrack keeps each ID steady</text><polyline points="392,366 392,396" fill="none" stroke="#16130F" stroke-width="2.4" marker-end="url(#ah)"/><rect x="251.0" y="404" width="290" height="62" rx="10" fill="#16130F"/><rect x="247.0" y="400" width="290" height="62" rx="10" fill="#E9E1D6" stroke="#16130F" stroke-width="2.5"/><rect x="247.0" y="400" width="6" height="62" rx="3" fill="#E8590C"/><text x="395" y="425.0" class="ct" text-anchor="middle">Keep detections inside the area</text><text x="395" y="442.0" class="cs" text-anchor="middle">Items on the bank or bridge are dropped</text><polyline points="392,462 392,492" fill="none" stroke="#16130F" stroke-width="2.4" marker-end="url(#ah)"/><rect x="251.0" y="500" width="290" height="62" rx="10" fill="#16130F"/><rect x="247.0" y="496" width="290" height="62" rx="10" fill="#E9E1D6" stroke="#16130F" stroke-width="2.5"/><rect x="247.0" y="496" width="6" height="62" rx="3" fill="#E8590C"/><text x="395" y="521.0" class="ct" text-anchor="middle">Count items in the area</text><text x="395" y="538.0" class="cs" text-anchor="middle">Median of the last 15 frames</text><polyline points="392,558 392,588" fill="none" stroke="#16130F" stroke-width="2.4" marker-end="url(#ah)"/><polygon points="396,594.0 561.0,644 396,694.0 231.0,644" fill="#16130F"/><polygon points="392,590.0 557.0,640 392,690.0 227.0,640" fill="#E8A317" stroke="#16130F" stroke-width="2.5" stroke-linejoin="round"/><text x="392" y="636" class="ct" text-anchor="middle">Count reached threshold?</text><text x="392" y="652" class="cs" text-anchor="middle">default 20, alert not yet raised</text><polyline points="392,690 392,722" fill="none" stroke="#16130F" stroke-width="2.4" marker-end="url(#ah)"/><text x="404" y="711" class="al" text-anchor="start">Yes</text><rect x="251.0" y="730" width="290" height="62" rx="10" fill="#16130F"/><rect x="247.0" y="726" width="290" height="62" rx="10" fill="#E9E1D6" stroke="#16130F" stroke-width="2.5"/><rect x="247.0" y="726" width="6" height="62" rx="3" fill="#D92D20"/><text x="395" y="751.0" class="ct" text-anchor="middle">Raise accumulation alert</text><text x="395" y="768.0" class="cs" text-anchor="middle">On screen, buzzer and push to the app</text><polyline points="392,788 392,818" fill="none" stroke="#16130F" stroke-width="2.4" marker-end="url(#ah)"/><rect x="251.0" y="826" width="290" height="62" rx="10" fill="#16130F"/><rect x="247.0" y="822" width="290" height="62" rx="10" fill="#E9E1D6" stroke="#16130F" stroke-width="2.5"/><rect x="247.0" y="822" width="6" height="62" rx="3" fill="#B7791F"/><text x="395" y="847.0" class="ct" text-anchor="middle">Save alert record and snapshot</text><text x="395" y="864.0" class="cs" text-anchor="middle">Written to SQLite, synced to Firebase</text><polyline points="392,884 392,926" fill="none" stroke="#16130F" stroke-width="2.4" marker-end="url(#ah)"/><polyline points="557,640 770,640 770,692" fill="none" stroke="#16130F" stroke-width="2.4" marker-end="url(#ah)"/><text x="572" y="630" class="al" text-anchor="start">No</text><polygon points="774,698.0 924.0,748 774,798.0 624.0,748" fill="#16130F"/><polygon points="770,694.0 920.0,744 770,794.0 620.0,744" fill="#E8A317" stroke="#16130F" stroke-width="2.5" stroke-linejoin="round"/><text x="770" y="740" class="ct" text-anchor="middle">Count fell to re-arm level?</text><text x="770" y="756" class="cs" text-anchor="middle">15 for a threshold of 20</text><polyline points="770,794 770,822" fill="none" stroke="#16130F" stroke-width="2.4" marker-end="url(#ah)"/><text x="782" y="813" class="al" text-anchor="start">Yes</text><rect x="664.0" y="830" width="220" height="62" rx="10" fill="#16130F"/><rect x="660.0" y="826" width="220" height="62" rx="10" fill="#E9E1D6" stroke="#16130F" stroke-width="2.5"/><rect x="660.0" y="826" width="6" height="62" rx="3" fill="#2F9E44"/><text x="773" y="851.0" class="ct" text-anchor="middle">Clear the alert</text><text x="773" y="868.0" class="cs" text-anchor="middle">Ready for the next one</text><polyline points="770,888 770,955 517,955" fill="none" stroke="#16130F" stroke-width="2.4" marker-end="url(#ah)"/><polyline points="920,744 950,744 950,967 517,967" fill="none" stroke="#16130F" stroke-width="2.4" marker-end="url(#ah)"/><text x="934" y="734" class="al" text-anchor="start">No</text><polygon points="283.0,934 527.0,934 509.0,996 265.0,996" fill="#16130F"/><polygon points="279.0,930 523.0,930 505.0,992 261.0,992" fill="#E9E1D6" stroke="#16130F" stroke-width="2.5" stroke-linejoin="round"/><rect x="279.0" y="930" width="244" height="5" fill="#2F9E44"/><text x="392" y="966.0" class="ct" text-anchor="middle">Show results on the dashboard</text><polyline points="392,992 392,1030 72,1030 72,229 266,229" fill="none" stroke="#16130F" stroke-width="2.4" stroke-dasharray="8 5" marker-end="url(#ah)"/><text x="84" y="1024" class="al" text-anchor="start">Continuous loop</text><text x="46" y="1070" class="lg" text-anchor="start">Note. The count is the number of items inside the drawn area in the current frame, smoothed as the median of the last 15 frames, so it falls</text><text x="46" y="1085" class="lg" text-anchor="start">when items drift out. An alert is raised once when the count reaches the threshold and re-arms when it falls to the re-arm level. Alerts,</text><text x="46" y="1100" class="lg" text-anchor="start">manual captures and tests are saved with a snapshot; a frame that raises no alert is shown but not stored, and latency is logged every 100 frames.</text>
